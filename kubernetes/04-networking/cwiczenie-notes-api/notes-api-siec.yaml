# ★ Ćwiczenie sekcji 4: Service i Ingress dla notes-api (Deployment z ćwiczenia sekcji 3)
apiVersion: v1
kind: Service
metadata:
  name: notes-api
  namespace: notes
spec:
  selector:
    app: notes-api
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notes-api
  namespace: notes
spec:
  ingressClassName: nginx
  rules:
  - host: notes.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: notes-api
            port: { number: 80 }
