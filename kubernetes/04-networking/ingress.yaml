# Nazwy i porty Serwisów dopasowane do ćwiczenia 4.3 (frontend-svc / backend-svc na porcie 80);
# w materiałach: frontend-service:80 i backend-service:8080
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moja-aplikacja-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: app.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-svc
            port: { number: 80 }
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-svc
            port: { number: 80 }
