# Typowa odpowiedź AI na krótki prompt: "napisz manifesty Kubernetes dla mojego API notatek z Ingressem".
# Zawiera błędy – znajdź je według checklista.md. NIE wdrażaj tego pliku.
apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: notes-api
spec:
  replicas: 3
  template:
    metadata:
      labels:
        app: notes
    spec:
      containers:
      - name: notes-api
        image: notes-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: PGPASSWORD
          value: "SuperTajneHaslo123"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: notes-api
spec:
  type: LoadBalancer
  selector:
    app: notes-api
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notes-api
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: notes.local
    http:
      paths:
      - path: /
        backend:
          serviceName: notes-api
          servicePort: 80
