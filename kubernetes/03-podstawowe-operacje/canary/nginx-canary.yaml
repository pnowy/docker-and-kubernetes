apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-canary
spec:
  replicas: 1
  selector:
    matchLabels: { app: nginx-canary-demo, track: canary }
  template:
    metadata:
      labels: { app: nginx-canary-demo, track: canary }
    spec:
      containers:
      - name: nginx
        image: nginx:1.29
        ports:
        - containerPort: 80
