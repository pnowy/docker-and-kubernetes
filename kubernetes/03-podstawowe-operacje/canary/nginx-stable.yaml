apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-stable
spec:
  replicas: 9
  selector:
    matchLabels: { app: nginx-canary-demo, track: stable }
  template:
    metadata:
      labels: { app: nginx-canary-demo, track: stable }
    spec:
      containers:
      - name: nginx
        image: nginx:1.28
        ports:
        - containerPort: 80
