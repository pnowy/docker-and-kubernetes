# ★ Sondy: readiness decyduje o ruchu, liveness o restarcie kontenera, startup chroni wolny start
apiVersion: v1
kind: Pod
metadata:
  name: sonda-readiness
  labels:
    app: sondy
spec:
  containers:
  - name: nginx
    image: nginx:1.29
    readinessProbe:          # Ready dopiero, gdy istnieje plik /tmp/gotowe
      exec:
        command: ["cat", "/tmp/gotowe"]
      periodSeconds: 5
---
apiVersion: v1
kind: Pod
metadata:
  name: sonda-liveness
  labels:
    app: sondy
spec:
  containers:
  - name: nginx
    image: nginx:1.29
    livenessProbe:           # strona nie istnieje → 404 → kubelet restartuje kontener po 3 porażkach
      httpGet:
        path: /nie-istnieje
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 3
---
apiVersion: v1
kind: Pod
metadata:
  name: sonda-startup
  labels:
    app: sondy
spec:
  containers:
  - name: nginx
    image: nginx:1.29
    command: ["sh", "-c", "sleep 20 && exec nginx -g 'daemon off;'"]   # wolny start: 20 s
    startupProbe:            # do 12 × 5 s = 60 s na start; liveness i readiness czekają
      httpGet:
        path: /
        port: 80
      periodSeconds: 5
      failureThreshold: 12
    livenessProbe:           # sama (3 × 5 s = 15 s) zabiłaby kontener przed końcem startu
      httpGet:
        path: /
        port: 80
      periodSeconds: 5
      failureThreshold: 3
    readinessProbe:          # tcpSocket: wystarczy, że port 80 przyjmuje połączenia
      tcpSocket:
        port: 80
      periodSeconds: 5
