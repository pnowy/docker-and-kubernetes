apiVersion: v1
kind: ConfigMap
metadata:
  name: notes-config
  namespace: notes
data:
  APP_VERSION: "1.0.0"
  STORAGE: json            # sekcja 5 przełącza na PostgreSQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
  namespace: notes
  annotations:
    kubernetes.io/change-cause: "notes-api 1.0.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0    # stare Pody obsługują ruch, dopóki nowe nie są Ready
  selector:
    matchLabels:
      app: notes-api
  template:
    metadata:
      labels:
        app: notes-api
    spec:
      containers:
      - name: api
        image: notes-api:1.0.0
        imagePullPolicy: IfNotPresent   # obraz jest tylko w klaszterze (minikube image load), nie w rejestrze
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: notes-config
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          periodSeconds: 10
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 500m, memory: 256Mi }
