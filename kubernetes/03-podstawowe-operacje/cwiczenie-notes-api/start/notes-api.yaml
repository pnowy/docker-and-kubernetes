# Punkt startowy ćwiczenia: minimalny Deployment notes-api. Uzupełnij go według README sekcji 3.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
  namespace: notes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-api
  template:
    metadata:
      labels:
        app: notes-api
    spec:
      containers:
      - name: api
        image: notes-api:1.0.0
        ports:
        - containerPort: 3000
