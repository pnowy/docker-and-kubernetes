apiVersion: v1
kind: Namespace
metadata:
  name: testowa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-agent
  namespace: testowa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: testowa
  name: pod-reader
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods
  namespace: testowa
subjects:
- kind: ServiceAccount
  name: monitoring-agent
  namespace: testowa
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
