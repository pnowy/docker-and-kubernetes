# Scenariusz 1: aplikacja web nie odpowiada przez Serwis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: awarie
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
      - name: nginx
        image: nginx:1.29
        resources:
          requests: { cpu: 50m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: awarie
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
