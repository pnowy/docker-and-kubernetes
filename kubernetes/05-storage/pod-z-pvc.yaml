# Użycie PVC w Podzie
apiVersion: v1
kind: Pod
metadata:
  name: postgres-pvc
spec:
  containers:
  - name: app
    image: postgres:18
    env:
    - name: POSTGRES_PASSWORD
      value: "secret"
    volumeMounts:
    - mountPath: /var/lib/postgresql   # od PostgreSQL 18 (materiały: postgres:15 i /var/lib/postgresql/data)
      name: db-storage
  volumes:
  - name: db-storage
    persistentVolumeClaim:
      claimName: moj-pvc
