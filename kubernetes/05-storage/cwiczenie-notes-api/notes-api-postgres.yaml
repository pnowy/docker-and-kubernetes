# ★ notes-api z bazą: ConfigMap przełącza STORAGE na postgres, init container czeka na bazę
apiVersion: v1
kind: ConfigMap
metadata:
  name: notes-config
  namespace: notes
data:
  APP_VERSION: "1.1.0"
  STORAGE: postgres
  PGHOST: notes-db
  PGDATABASE: notes
  PGUSER: notes
  PGPASSWORD_FILE: /run/secrets/db/password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
  namespace: notes
  annotations:
    kubernetes.io/change-cause: "notes-api 1.1.0 + PostgreSQL"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: notes-api
  template:
    metadata:
      labels:
        app: notes-api
    spec:
      initContainers:
      - name: czekaj-na-baze     # kontener główny startuje dopiero, gdy ten zakończy się sukcesem
        image: postgres:18
        command: ["sh", "-c", "until pg_isready -h notes-db -U notes; do echo czekam na bazę; sleep 2; done"]
      containers:
      - name: api
        image: notes-api:1.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: notes-config
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          periodSeconds: 10
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 500m, memory: 256Mi }
        volumeMounts:
        - name: db-secret
          mountPath: /run/secrets/db
          readOnly: true
      volumes:
      - name: db-secret
        secret:
          secretName: notes-db
