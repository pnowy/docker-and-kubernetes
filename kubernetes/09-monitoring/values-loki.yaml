# Loki w trybie monolitycznym na jednym Podzie, dane na dysku (PVC) – wystarczy do nauki, nie do produkcji
deploymentMode: Monolithic
loki:
  auth_enabled: false           # bez multi-tenancy, Grafana nie musi podawać X-Scope-OrgID
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: loki_index_
        period: 24h
singleBinary:
  replicas: 1
  persistence:
    size: 2Gi
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
