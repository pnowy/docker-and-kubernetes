apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mojeaplikacje.example.com
spec:
  group: example.com
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              replicas:
                type: integer
                minimum: 1
              image:
                type: string
  scope: Namespaced
  names:
    plural: mojeaplikacje
    singular: mojaaplikacja
    kind: MojaAplikacja
    shortNames: [ma]
