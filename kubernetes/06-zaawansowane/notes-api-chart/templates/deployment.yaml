apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: notes-api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: notes-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notes-api
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # zmiana ConfigMap zmienia sumę kontrolną, a ta – szablon Poda, więc helm upgrade restartuje Pody
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
      - name: api
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-config
        readinessProbe:
          httpGet: { path: /readyz, port: 3000 }
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /healthz, port: 3000 }
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- if eq .Values.storage "postgres" }}
        volumeMounts:
        - name: db-secret
          mountPath: /run/secrets/db
          readOnly: true
      volumes:
      - name: db-secret
        secret:
          secretName: {{ .Values.postgres.passwordSecret }}
        {{- end }}
