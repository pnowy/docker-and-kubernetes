name: notes

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      # od PostgreSQL 18 montujemy /var/lib/postgresql (dane trafiają do podkatalogu z numerem wersji)
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    image: notes-api:${APP_VERSION}
    environment:
      APP_VERSION: ${APP_VERSION}
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "${APP_PORT}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  adminer:
    image: adminer:5
    profiles: [narzedzia]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  db-data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
