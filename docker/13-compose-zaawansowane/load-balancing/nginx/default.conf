# Wbudowany DNS Dockera; valid=5s – nowe repliki (docker compose up --scale) widoczne po kilku sekundach
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api {
    zone api 64k;          # wymagane przez "resolve"
    # "resolve" odświeża listę adresów serwisu api; bez niego nginx zna tylko repliki ze startu
    server api:3000 resolve max_fails=1 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://api;
        # nieudane żądanie (padnięta replika, 502/503) trafia do kolejnej
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;   # zamrożona replika: po 3 s przejście do następnej
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Upstream $upstream_addr always;
    }
}
