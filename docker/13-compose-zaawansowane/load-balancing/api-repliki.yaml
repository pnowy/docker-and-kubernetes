# Nadpisanie serwisu api z app-node/compose.yaml na potrzeby load balancingu
services:
  api:
    # repliki nie mogą dzielić portu hosta – ruch przyjmuje proxy
    ports: !reset []
    deploy:
      replicas: 3
    labels:
      # Traefik czyta konfigurację z etykiet kontenerów
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/`)
      - traefik.http.routers.api.entrypoints=web
      # nieudane połączenie z repliką: ponów na innej
      - traefik.http.middlewares.ponow.retry.attempts=2
      - traefik.http.routers.api.middlewares=ponow
      - traefik.http.services.api.loadbalancer.server.port=3000
      - traefik.http.services.api.loadbalancer.healthcheck.path=/readyz
      - traefik.http.services.api.loadbalancer.healthcheck.interval=2s
