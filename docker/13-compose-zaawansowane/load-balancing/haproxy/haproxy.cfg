global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    # nieudane połączenie z repliką: ponów na innej
    retries 2
    option redispatch 1

# Wbudowany DNS Dockera – HAProxy sam odkrywa repliki serwisu api
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

frontend web
    bind :80
    default_backend api

backend api
    balance roundrobin
    # aktywny health check: replika bez połączenia z bazą (503 z /readyz) wypada z puli
    option httpchk GET /readyz
    http-response set-header X-Server %s
    # do 5 slotów wypełnianych adresami z DNS (skalowanie do 5 replik bez zmiany konfiguracji)
    server-template api 5 api:3000 check inter 2s fall 2 rise 2 resolvers docker init-addr none

frontend stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 2s
